name: Report an unexpected problem
description: A crash, broken instruction, or behaviour outside the documented exercise.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        The starter's 2/6 score and exit code 1 with --check are intentional.
        Use "Tried the lab" for learner feedback or help with the exercise.
        This report is public. Do not include secrets, personal contact details,
        private documents, customer data, or full private filesystem paths.
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      description: For example, Windows with Python 3.12. Include a commit or version if known.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce the problem?
      description: Include the command, selected mode, and any changes to the starter.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: What did you expect, and what happened?
      description: Include the RESULT line or a short, redacted error if available.
    validations:
      required: true
